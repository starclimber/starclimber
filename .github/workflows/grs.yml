name: GRS Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Overview card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=starclimber&show_icons=true&hide_border=true&theme=tokyonight&bg_color=0D1117&title_color=7AA2F7&icon_color=BB9AF7&text_color=C9D1D9&include_all_commits=true&locale=zh"
          path: images/overview.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=starclimber&layout=compact&langs_count=8&hide_border=true&theme=tokyonight&bg_color=0D1117&title_color=7AA2F7&text_color=C9D1D9&hide=html,css,scss,shell,batch,makefile&card_width=320"
          path: images/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Update GRS cards"
          git push
